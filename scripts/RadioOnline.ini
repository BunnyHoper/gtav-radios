; Radio online (script RadioOnline.dll). Solo suena dentro de un vehiculo y apaga la radio del juego.
; Teclas: nombres de .NET (Home, PageUp, PageDown, Add = + del teclado numerico, Subtract = -, End, Insert...)
[KEYS]
Toggle=Home
Next=PageUp
Previous=PageDown
VolumeUp=Add
VolumeDown=Subtract

[SETTINGS]
; volumen inicial 0-100
Volume=60
; true = arranca encendida al subir al coche
StartEnabled=true

